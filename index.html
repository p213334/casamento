<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roleta de Presentes</title>
  <style>
    :root {
      --olive-dark: #2A331B;
      --olive-main: #4D5E2B;
      --olive-light: #708238;
      --olive-soft: #9BAA7C;
      --cream-bg: #F5F4EF;
      --gold-accent: #D4AF37;
      --text-color: #202715;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      background-color: var(--cream-bg);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(112, 130, 56, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, #FAF9F5 0%, #EAE7DC 100%);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      transition: background 2s ease;
      overflow: hidden;
      position: relative;
    }

    body.spinning {
      background-color: #0E120A;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.15) 0%, rgba(14, 18, 10, 0.96) 70%),
        radial-gradient(circle at 20% 30%, rgba(77, 94, 43, 0.25) 0%, transparent 40%);
    }

    .container {
      text-align: center;
      max-width: 420px;
      width: 100%;
      z-index: 2;
    }

    .header h1 {
      font-weight: 300;
      letter-spacing: 3px;
      font-size: 1.5rem;
      text-transform: uppercase;
      transition: color 0.8s ease;
    }

    body.spinning .header h1 {
      color: #F5F4EF;
    }

    .header p {
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      color: var(--olive-soft);
      margin-top: 6px;
    }

    .attempts-badge {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-accent);
      margin-top: 10px;
      font-weight: 600;
    }

    .wheel-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
      margin: 20px auto;
    }

    .pointer-container {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 30px;
      height: 40px;
      display: flex;
      justify-content: center;
    }

    .pointer-joint {
      position: absolute;
      top: 0;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, #FFF 20%, #D4AF37 80%);
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      z-index: 2;
    }

    .pointer-pin {
      position: absolute;
      top: 6px;
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 28px solid var(--gold-accent);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      transform-origin: 50% 0%;
      transition: transform 0.04s ease-out;
    }

    canvas#wheel {
      border-radius: 50%;
      box-shadow: 0 12px 35px rgba(42, 51, 27, 0.18);
      transition: box-shadow 1.5s ease;
      animation: floatWheel 4s ease-in-out infinite alternate;
    }

    @keyframes floatWheel {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    body.spinning canvas#wheel {
      box-shadow: 0 0 55px rgba(212, 175, 55, 0.4);
      animation: none;
    }

    canvas#confetti {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 100;
    }

    button {
      margin-top: 15px;
      padding: 14px 40px;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--cream-bg);
      background-color: var(--olive-main);
      border: 1px solid var(--gold-accent);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    button:hover:not(:disabled) {
      background-color: var(--gold-accent);
      color: var(--olive-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
    }

    button:disabled {
      opacity: 0.2;
      cursor: not-allowed;
      border-color: transparent;
    }

    #status-container {
      margin-top: 15px;
      height: 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #status-label {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--olive-soft);
      margin-bottom: 2px;
    }

    #status-text {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--gold-accent);
      transition: transform 0.1s ease;
    }

    #status-text.pulse {
      transform: scale(1.15);
    }

    #result {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold-accent);
      margin-top: 10px;
      min-height: 35px;
    }

    .reveal-animation {
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div class="container">
    <div class="header">
      <h1>Roleta do Casal</h1>
      <p>💍 Presente de Casamento</p>
      <div class="attempts-badge" id="attemptsBadge">Tentativa 1 de 3</div>
    </div>

    <div class="wheel-wrapper">
      <div class="pointer-container">
        <div class="pointer-joint"></div>
        <div class="pointer-pin" id="pointerPin"></div>
      </div>
      <canvas id="wheel" width="340" height="340"></canvas>
    </div>

    <button id="spinBtn" onclick="startNaturalSpin()">Girar 1ª Vez</button>

    <div id="status-container">
      <div id="status-label"></div>
      <div id="status-text"></div>
    </div>

    <div id="result"></div>
  </div>

  <script>
    const items = [
      "Jantar Romântico",
      "Viagem Surpresa",
      "O PRÊMIO ESPECIAL",
      "Noite de Cinema",
      "Café na Cama",
      "Vale Massagem"
    ];

    const TARGET_INDEX = 2; // Índice do Presente Especial

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const pointerPin = document.getElementById("pointerPin");
    const spinBtn = document.getElementById("spinBtn");
    const attemptsBadge = document.getElementById("attemptsBadge");
    
    const numItems = items.length;
    const arcSize = (2 * Math.PI) / numItems;
    const colors = ["#3B4920", "#4D5E2B", "#5C6F36", "#708238", "#3B4920", "#5C6F36"];

    let currentAngle = 0;
    let isSpinning = false;
    let currentAttempt = 1;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTickSound(speedRatio) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      const freq = 160 + (speedRatio * 380); 
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playWinSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (i * 0.12));
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (i * 0.12));
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (i * 0.12) + 0.8);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + (i * 0.12));
        osc.stop(audioCtx.currentTime + (i * 0.12) + 0.8);
      });
    }

    function drawWheel(rotation = 0) {
      ctx.clearRect(0, 0, 340, 340);
      
      for (let i = 0; i < numItems; i++) {
        const angle = rotation + (i * arcSize);
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(170, 170);
        ctx.arc(170, 170, 165, angle, angle + arcSize);
        ctx.fill();

        ctx.strokeStyle = "#F5F4EF";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(170, 170);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        
        ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
        ctx.shadowBlur = 4;
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 13px -apple-system, sans-serif";
        ctx.fillText(items[i], 148, 5);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(170, 170, 24, 0, 2 * Math.PI);
      ctx.fillStyle = "#F5F4EF";
      ctx.fill();
      ctx.strokeStyle = "#D4AF37";
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    drawWheel(currentAngle);

    function getTargetIndexForAttempt(attempt) {
      if (attempt === 3) return TARGET_INDEX;
      
      // Tentativas 1 e 2: escolhe qualquer item exceto TARGET_INDEX
      const otherIndices = items.map((_, i) => i).filter(i => i !== TARGET_INDEX);
      return attempt === 1 ? otherIndices[0] : otherIndices[3]; 
    }

    function startNaturalSpin() {
      if (isSpinning) return;
      initAudio();
      
      isSpinning = true;
      document.body.classList.add("spinning");
      spinBtn.disabled = true;
      document.getElementById("result").innerText = "";

      const degreesPerSlice = 360 / numItems;
      const chosenIndex = getTargetIndexForAttempt(currentAttempt);
      const sliceStartAngle = chosenIndex * degreesPerSlice;
      
      // Se for a 3ª tentativa, cai logo após a borda para o máximo suspense
      const offset = currentAttempt === 3 ? 1.8 : (degreesPerSlice / 2);
      const targetAngleInSlice = sliceStartAngle + offset; 
      
      const finalAngleDegrees = (270 - targetAngleInSlice + 360) % 360;
      
      // Duração e voltas maiores na última tentativa para dar aquele efeito final
      const totalDegrees = (360 * (currentAttempt === 3 ? 10 : 6)) + finalAngleDegrees;
      const duration = currentAttempt === 3 ? 14000 : 7000;
      
      const startTime = performance.now();
      let lastSlice = -1;

      function continuousCreepEase(t) {
        return 1 - Math.pow(1 - t, currentAttempt === 3 ? 5 : 4);
      }

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easedProgress = continuousCreepEase(progress);
        const currentDegrees = totalDegrees * easedProgress;
        currentAngle = (currentDegrees * Math.PI) / 180;
        
        drawWheel(currentAngle);

        const currentSlice = Math.floor(((270 - (currentDegrees % 360) + 360) % 360) / degreesPerSlice);
        const currentItemName = items[currentSlice];

        const speedRatio = Math.pow(1 - progress, 4);
        const sliceNormalized = (currentDegrees % degreesPerSlice);
        
        let bendAngle = 0;
        if (sliceNormalized < 12) {
          bendAngle = (12 - sliceNormalized) * 2.2 * Math.max(0.1, speedRatio);
        }
        pointerPin.style.transform = `rotate(${-bendAngle}deg)`;

        const labelEl = document.getElementById("status-label");
        const statusEl = document.getElementById("status-text");

        if (currentAttempt === 3) {
          if (progress < 0.25) {
            labelEl.innerText = "ÚLTIMA CHANCE!";
            statusEl.innerText = "Sua sorte final...";
          } else if (progress >= 0.25 && progress < 0.70) {
            labelEl.innerText = "Passando por";
            statusEl.innerText = currentItemName;
          } else if (progress >= 0.70 && progress < 0.90) {
            labelEl.innerText = "Diminuindo...";
            statusEl.innerText = `${currentItemName}...`;
          } else if (progress >= 0.90 && progress < 0.98) {
            labelEl.innerText = "QUASE LÁ...";
            statusEl.innerText = "SÓ MAIS UM POUQUINHO!";
          } else {
            labelEl.innerText = "NO LANCE FINAL!";
            statusEl.innerText = currentItemName;
          }
        } else {
          labelEl.innerText = `Tentativa ${currentAttempt} de 3`;
          statusEl.innerText = currentItemName;
        }

        if (currentSlice !== lastSlice) {
          playTickSound(Math.max(0.02, speedRatio));
          statusEl.classList.add("pulse");
          setTimeout(() => statusEl.classList.remove("pulse"), 80);
          lastSlice = currentSlice;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          pointerPin.style.transform = `rotate(0deg)`;
          document.body.classList.remove("spinning");
          
          const resultEl = document.getElementById("result");

          if (currentAttempt < 3) {
            labelEl.innerText = `Resultado da ${currentAttempt}ª tentativa`;
            resultEl.innerText = `Você tirou: ${items[chosenIndex]}`;
            
            currentAttempt++;
            attemptsBadge.innerText = `Tentativa ${currentAttempt} de 3`;
            spinBtn.innerText = `Girar ${currentAttempt}ª Vez`;
            spinBtn.disabled = false;
            isSpinning = false;
          } else {
            labelEl.innerText = "RESULTADO FINAL";
            statusEl.innerText = "";
            resultEl.innerText = `✨ ${items[TARGET_INDEX]} ✨`;
            resultEl.classList.add("reveal-animation");
            
            spinBtn.innerText = "Prêmio Revelado!";
            attemptsBadge.innerText = "Tentativas Encerradas";
            playWinSound();
            triggerConfetti();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    function triggerConfetti() {
      const confettiCanvas = document.getElementById("confetti");
      const cCtx = confettiCanvas.getContext("2d");
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;

      const particles = [];
      const particleColors = ["#D4AF37", "#4D5E2B", "#708238", "#F5F4EF"];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 13,
          vy: (Math.random() - 0.7) * 13,
          color: particleColors[Math.floor(Math.random() * particleColors.length)],
          size: Math.random() * 6 + 4,
          gravity: 0.22,
          opacity: 1
        });
      }

      function animateConfetti() {
        cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.opacity > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.opacity -= 0.01;

            cCtx.save();
            cCtx.globalAlpha = Math.max(0, p.opacity);
            cCtx.fillStyle = p.color;
            cCtx.beginPath();
            cCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            cCtx.fill();
            cCtx.restore();
          }
        });

        if (active) requestAnimationFrame(animateConfetti);
      }

      animateConfetti();
    }
  </script>
</body>
</html>
