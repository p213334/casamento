<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roleta de Presentes</title>
  <style>
    :root {
      --olive-dark: #2A331B;
      --olive-main: #4D5E2B;
      --olive-light: #708238;
      --olive-soft: #9BAA7C;
      --cream-bg: #F5F4EF;
      --gold-accent: #D4AF37;
      --text-color: #202715;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      background-color: var(--cream-bg);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      transition: background-color 1.2s ease, color 1.2s ease;
      overflow: hidden;
    }

    body.spinning {
      background-color: #12160C;
      color: #E2E5D8;
    }

    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
      z-index: 2;
    }

    .header h1 {
      font-weight: 300;
      letter-spacing: 3px;
      font-size: 1.5rem;
      text-transform: uppercase;
      transition: color 0.5s ease;
    }

    body.spinning .header h1 {
      color: #F5F4EF;
    }

    .header p {
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      color: var(--olive-soft);
      margin-top: 6px;
    }

    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 30px auto;
    }

    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 22px solid var(--gold-accent);
      z-index: 10;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
      transform-origin: 50% 0%;
      transition: transform 0.05s ease;
    }

    .pointer.tick {
      transform: translateX(-50%) rotate(-18deg);
    }

    canvas#wheel {
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      transition: box-shadow 1s ease;
    }

    body.spinning canvas#wheel {
      box-shadow: 0 0 45px rgba(212, 175, 55, 0.35);
    }

    canvas#confetti {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 100;
    }

    button {
      margin-top: 20px;
      padding: 14px 40px;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--cream-bg);
      background-color: var(--olive-main);
      border: 1px solid var(--gold-accent);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    button:hover:not(:disabled) {
      background-color: var(--gold-accent);
      color: var(--olive-dark);
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.2;
      cursor: not-allowed;
      border-color: transparent;
    }

    #status-text {
      margin-top: 20px;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      height: 24px;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--gold-accent);
    }

    #result {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--gold-accent);
      margin-top: 10px;
      min-height: 35px;
    }

    .reveal-animation {
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div class="container">
    <div class="header">
      <h1>Roleta do Casal</h1>
      <p>💍 Presente de Casamento</p>
    </div>

    <div class="wheel-wrapper">
      <div class="pointer" id="pointer"></div>
      <canvas id="wheel" width="320" height="320"></canvas>
    </div>

    <button id="spinBtn" onclick="startDramaticSpin()">Girar Roleta</button>
    <div id="status-text"></div>
    <div id="result"></div>
  </div>

  <script>
    const items = [
      "Jantar Romântico",
      "Viagem Surpresa",
      "O PRÊMIO ESPECIAL",
      "Noite de Cinema",
      "Café na Cama",
      "Vale Massagem"
    ];

    // Índice do vencedor configurado (2 = "O PRÊMIO ESPECIAL")
    const TARGET_INDEX = 2;

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const pointer = document.getElementById("pointer");
    const numItems = items.length;
    const arcSize = (2 * Math.PI) / numItems;
    const colors = ["#4D5E2B", "#5C6F36", "#708238", "#8A9B52", "#4D5E2B", "#5C6F36"];

    let currentAngle = 0;
    let isSpinning = false;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTickSound(speedRatio) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      const freq = 250 + (speedRatio * 350); 
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);

      pointer.classList.add("tick");
      setTimeout(() => pointer.classList.remove("tick"), 50);
    }

    function playWinSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (i * 0.12));
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (i * 0.12));
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (i * 0.12) + 0.8);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + (i * 0.12));
        osc.stop(audioCtx.currentTime + (i * 0.12) + 0.8);
      });
    }

    function drawWheel(rotation = 0) {
      ctx.clearRect(0, 0, 320, 320);
      
      for (let i = 0; i < numItems; i++) {
        const angle = rotation + (i * arcSize);
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(160, 160);
        ctx.arc(160, 160, 155, angle, angle + arcSize);
        ctx.fill();

        ctx.strokeStyle = "#F5F4EF";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.save();
        ctx.translate(160, 160);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#F5F4EF";
        ctx.font = "500 12px sans-serif";
        ctx.fillText(items[i], 135, 4);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(160, 160, 22, 0, 2 * Math.PI);
      ctx.fillStyle = "#F5F4EF";
      ctx.fill();
      ctx.strokeStyle = "#D4AF37";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    drawWheel(currentAngle);

    function startDramaticSpin() {
      if (isSpinning) return;
      initAudio();
      
      isSpinning = true;
      document.body.classList.add("spinning");
      document.getElementById("spinBtn").disabled = true;
      document.getElementById("result").innerText = "";
      document.getElementById("status-text").innerText = "Qual opção vai sair?";

      const degreesPerSlice = 360 / numItems;
      
      // Posição ajustada ligeiramente além da borda de entrada do item vencedor
      // para forçar o ponteiro a cruzar a pino divisório no instante final.
      const targetSliceCenter = (TARGET_INDEX * degreesPerSlice) + (degreesPerSlice * 0.35);
      
      const finalAngleDegrees = (270 - targetSliceCenter + 360) % 360;
      const totalDegrees = (360 * 11) + finalAngleDegrees;
      
      const duration = 11000; // 11 segundos
      const startTime = performance.now();
      let lastSlice = -1;

      // Curva em 3 estágios: Rápido -> Quase para no item anterior -> Empurrão lento final
      function dramaticEasing(t) {
        if (t < 0.65) {
          // Estágio 1: Desaceleração até 88% da rotação total
          return Math.pow(t / 0.65, 2) * 0.88;
        } else if (t < 0.88) {
          // Estágio 2: Rastejo lento bem em cima da divisão da opção anterior
          const subT = (t - 0.65) / 0.23;
          return 0.88 + (1 - Math.pow(1 - subT, 2)) * 0.08;
        } else {
          // Estágio 3: O clique final agoniante que ultrapassa a linha
          const subT = (t - 0.88) / 0.12;
          return 0.96 + (1 - Math.pow(1 - subT, 3)) * 0.04;
        }
      }

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easedProgress = dramaticEasing(progress);
        const currentDegrees = totalDegrees * easedProgress;
        currentAngle = (currentDegrees * Math.PI) / 180;
        
        drawWheel(currentAngle);

        const currentSlice = Math.floor(((270 - (currentDegrees % 360) + 360) % 360) / degreesPerSlice);
        const currentItemName = items[currentSlice];

        if (progress > 0.55 && progress < 0.88) {
          document.getElementById("status-text").innerText = `Vai parar em: ${currentItemName}?`;
        } else if (progress >= 0.88) {
          document.getElementById("status-text").innerText = `Quase... só mais um pouco...`;
        }

        if (currentSlice !== lastSlice) {
          const speedRatio = 1 - progress;
          playTickSound(speedRatio);
          lastSlice = currentSlice;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          document.body.classList.remove("spinning");
          document.getElementById("status-text").innerText = "";
          
          const resultEl = document.getElementById("result");
          resultEl.innerText = `✨ ${items[TARGET_INDEX]} ✨`;
          resultEl.classList.add("reveal-animation");
          
          playWinSound();
          triggerConfetti();
        }
      }

      requestAnimationFrame(animate);
    }

    function triggerConfetti() {
      const confettiCanvas = document.getElementById("confetti");
      const cCtx = confettiCanvas.getContext("2d");
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;

      const particles = [];
      const particleColors = ["#D4AF37", "#4D5E2B", "#708238", "#F5F4EF"];

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 12,
          color: particleColors[Math.floor(Math.random() * particleColors.length)],
          size: Math.random() * 6 + 4,
          gravity: 0.25,
          opacity: 1
        });
      }

      function animateConfetti() {
        cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.opacity > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.opacity -= 0.012;

            cCtx.save();
            cCtx.globalAlpha = Math.max(0, p.opacity);
            cCtx.fillStyle = p.color;
            cCtx.beginPath();
            cCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            cCtx.fill();
            cCtx.restore();
          }
        });

        if (active) requestAnimationFrame(animateConfetti);
      }

      animateConfetti();
    }
  </script>
</body>
</html>
